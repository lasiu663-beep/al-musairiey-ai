<!doctype html><n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساعد المصيريعي الذكي</title><style>body{font-family:Arial;background:#f3f6fa;margin:0;color:#182b43}.app{max-width:850px;margin:5vh auto;background:white;border-radius:18px;box-shadow:0 8px 35px #0001;overflow:hidden}header{background:#102b4e;color:white;padding:22px}main{padding:24px;min-height:420px}#chat{display:flex;flex-direction:column;gap:12px}.msg{padding:13px 16px;border-radius:14px;max-width:80%;line-height:1.6;white-space:pre-wrap}.bot{background:#eef3f8;align-self:flex-start}.user{background:#15395f;color:white;align-self:flex-end}form{display:flex;gap:8px;padding:18px;border-top:1px solid #eee}input{flex:1;padding:14px;border:1px solid #ccd5df;border-radius:12px;font-size:16px}button{background:#15395f;color:white;border:0;border-radius:12px;padding:0 24px;font-size:16px;cursor:pointer}.hint{text-align:center;color:#718096;margin:30px 0}</style></head><body><div class="app"><header><h2>مساعد المصيريعي الذكي</h2><div>اسأل عن المنتجات والقطع والمواصفات</div></header><main><div class="hint" id="hint">مرحباً بك. اكتب سؤالك عن أي منتج.</div><div id="chat"></div></main><form id="form"><input id="q" placeholder="اكتب سؤالك هنا..." required><button>إرسال</button></form></div><script>const chat=document.getElementById('chat'),form=document.getElementById('form'),q=document.getElementById('q');function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);d.scrollIntoView({behavior:'smooth'});return d}form.onsubmit=async e=>{e.preventDefault();let s=q.value.trim();if(!s)return;document.getElementById('hint').remove();add(s,'user');q.value='';let wait=add('جاري البحث والإجابة...','bot');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:s})});let j=await r.json();wait.textContent=j.answer||j.error||'تعذر الحصول على إجابة.'}catch{wait.textContent='تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً.'}};</script></body></html>
